<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compound</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* surfaces — Compound near-black, green undertone */
    --bg:        #0a0f0d;
    --bg-0:      #0b100e;
    --bg-1:      #0e1412;
    --bg-2:      #131a18;
    --bg-3:      #1a2320;
    --bg-hover:  #1a2320;
    --bg-void:   #050807;
    --line:      rgba(255,255,255,0.07);
    --line-2:    rgba(255,255,255,0.11);
    --line-3:    rgba(255,255,255,0.17);
    /* text */
    --text:      #f4f8f6;
    --text-dim:  #a6b2ad;
    --text-mute: #6b7872;
    --text-faint:#44504b;
    /* accents — real DS values */
    --mint:      #34d399;
    --mint-2:    #1f9d6b;
    --mint-3:    #17795a;
    --mint-soft: rgba(52,211,153,0.13);
    --green-fg:  #6ee7b7;
    --amber:     #e8913a;
    --amber-soft:rgba(232,145,58,0.13);
    --coral:     #ef6f6f;
    --coral-soft:rgba(239,111,111,0.12);
    --blue:      #4d8df0;
    --blue-soft: rgba(77,141,240,0.13);
    --purple:    #6366f1;
    --purple-soft:rgba(99,102,241,0.15);
    --teal:      #2dd4bf;
    --teal-soft: rgba(45,212,191,0.12);
    --slate:     #8a938f;
    --faint:     #5a6560;
    /* type */
    --disp: 'Hanken Grotesk', system-ui, sans-serif;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --r: 12px;
    --r-sm: 8px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  #root { height: 100vh; }

  /* mono label helper */
  .mono { font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .ser { font-family: var(--serif); }

  ::selection { background: rgba(52,211,153,0.28); }
  .disp { font-family: var(--disp); }

  /* scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  ::-webkit-scrollbar-track { background: transparent; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  /* generic transitions for interactive cards */
  .lift { transition: background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes dash { to { stroke-dashoffset: -1000; } }

  .fade-up { animation: fadeUp .4s cubic-bezier(.2,.7,.3,1) both; }
  .fade-in { animation: fadeIn .4s ease both; }
</style>
</head>
